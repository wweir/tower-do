name: release

# Publish to npm on version tags. Tag must match package.json version
# (enforced below) so a misplaced tag never ships a wrong package.
on:
  push:
    tags:
      - "v*"

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # for npm provenance (public registry)
    steps:
      # fetch-depth 0: the release notes below walk back to the previous v* tag,
      # which a default depth-1 checkout cannot see — it silently degraded the
      # notes to the "Release <tag>" placeholder for v0.3.0 and v0.3.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # bun install is fast on this repo; no cache to avoid the
      # cache-poisoning surface.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 # zizmor: ignore[cache-poisoning] (no cache configured; comment above states intent)
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The repo publishes TypeScript sources directly (main: ./index.ts, no
      # build step) — tsc is the compile gate and the rest is the test gate.
      - name: Compile check
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Test gate
        run: |
          bun run test/smoke.ts
          bun run test/config.ts
          bun run test/owner-guard.ts
          bun run test/presence-retention.ts
          bun run test/changed-files.ts
          bun run test/scope-conflicts.ts
          bun run test/git-count.ts
          bun run test/live-sessions.ts
          bun run test/board-progress.ts

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' (${tag}) does not match package.json version ${pkg}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches package version ${pkg}"

      # npm does not read NODE_AUTH_TOKEN without a .npmrc registry mapping;
      # setup-node writes it (and publishes against the public registry).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning] (no cache configured; .npmrc write only)
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create the GitHub Release from the version tag (npm publish done).
      # Notes cover commits since the previous v* tag — no third-party action.
      - name: Create GitHub Release
        run: |
          prev="$(git tag --sort=-v:refname | grep -E '^v[0-9]+' | sed -n 2p || true)"
          if [ -n "$prev" ]; then
            range="$prev..HEAD"
          else
            range="HEAD"
          fi
          notes="$(git log "$range" --oneline --no-merges 2>/dev/null | sed 's/^[0-9a-f]\{7,\}//' | grep -E '^(feat|fix|chore|docs|ci|refactor|perf|test|revert)(\(|:)' | sed 's/^/ - /' || true)"
          if [ -z "$notes" ]; then
            notes="Release ${GITHUB_REF_NAME}"
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
